name: "generic_trigger"
on: workflow_dispatch

# This is required as per
# https://docs.github.com/en/actions/deployment/security-hardening-your-deployments/configuring-openid-connect-in-cloud-providers#adding-permissions-settings
permissions:
  id-token: write
  contents: read

jobs:
  build:
     runs-on: ubuntu-latest
     env:
      OIDC_PROVIDER: 'cba-github-oidc'
      OIDC_AUDIENCE: 'cba-github-oidc'
      PLATFORM_REPO: 'sum-cba-npm-virtual'
      BUILD_NAME: "cba-npm-build"
      BUILD_ID: "${{github.run_number}}"

     steps:
       - name: Checkout
         uses: actions/checkout@v3
              
   
       - name: Setup JFrog CLI
         uses: jfrog/setup-jfrog-cli@v4
         env:  
           JF_URL: https://psblr.jfrog.io
         with:
           oidc-provider-name: ${{ env.OIDC_PROVIDER }}
           oidc-audience: ${{ env.OIDC_AUDIENCE }}


       - name: Download from team repo
         run: jf rt dl sum-cba-team-local/template.json --fail-no-op

       - name: Download from generic repo
         run: jf rt dl sum-cba-gen-local/nn.txt --fail-no-op
