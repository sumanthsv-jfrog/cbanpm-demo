name: Docker Build with OIDC & JF CLI

on: workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      JFROG_HOST: psblr.jfrog.io

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Setup JFrog CLI (OIDC)
        id: setup-jfrog-cli
        uses: jfrog/setup-jfrog-cli@v4
        env:
          JF_URL: https://${{ env.JFROG_HOST }}
        with:
          oidc-provider-name: cba-github-oidc
          oidc-audience: cba-github-oidc

      - name: Sanity — jf can talk to JFrog
        run: jf rt ping

      - name: JFrog Docker registry login
        run: jf docker login "$JFROG_HOST"

      - name: Build Docker image (Method A)
        env:
          JFROG_TOKEN: ${{ steps.setup-jfrog-cli.outputs.oidc-token }}
        run: |
          docker build \
            -f Dockerfile-jfcli \
            --progress=plain \
            --secret id=jfrog_token,env=JFROG_TOKEN \
            -t my-app-method-a:${{ github.run_number }} \
            -t my-app-method-a:latest \
            .

      - name: Verify token not in image history
        env:
          JFROG_TOKEN: ${{ steps.setup-jfrog-cli.outputs.oidc-token }}
        run: |
          if docker history my-app-method-a:latest --no-trunc | grep -qF "$JFROG_TOKEN"; then
            echo "FAIL: token found in image history"
            exit 1
          fi
          echo "OK: token not present in image history"

      - name: Show image size
        run: docker images my-app-method-a:latest --format "{{.Repository}}:{{.Tag}}  {{.Size}}"

      - name: Docker logout
        if: always()
        run: docker logout "$JFROG_HOST" || true
